schema_version: "1.1"
name: uses-saved-printer-profile
context:
  scaffold_script: place-files.sh
expected_outcome: |
  The folder already holds printer.json (Ender 3 V2, 0.6 mm nozzle, minimum wall
  3.0 mm, hole allowance 0.4 mm, bridges up to 10 mm, PLA only, 220 x 220 bed). The
  assistant reads it and does not ask the printer questions again. It writes a .scad
  file next to printer.json whose Printer section copies those values (minimum wall
  3.0, M4 holes 4.4 mm), asserts the walls against them, and has the View section
  with assembly / print_layout / per-part modes. The part prints without supports
  and fits the 220 x 220 bed. Before calling it ready, it renders the part and
  reports measured against requested values (walls, screw holes, the 32 mm slot
  for the headband).
